[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alertsify-scraper"
version = "0.1.0"
description = "Poll Alertsify option positions and mirror new legs to Tradier with Turso dedupe and ntfy alerts."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "libsql>=0.1.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]

dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
alertsify-scraper = "alertsify_scraper.main:main"
alertsify-dashboard = "alertsify_scraper.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
